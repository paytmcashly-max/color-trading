services:
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["node", "apps/server/scripts/apply-schema.mjs"]
    restart: "no"
    environment: &backend-environment
      NODE_ENV: development
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000
      SOCKET_ALLOWED_ORIGINS: http://localhost:3000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/color_trading
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: local-compose-access-secret-change-before-shared-use
      JWT_REFRESH_SECRET: local-compose-refresh-secret-change-before-shared-use
      COOKIE_SECRET: local-compose-cookie-secret-change-before-shared-use
      ROUND_SEED_ENCRYPTION_KEY: local-compose-round-seed-key-change-before-shared-use
      JWT_ACCESS_TOKEN_TTL: 15m
      JWT_ACCESS_TOKEN_TTL_SECONDS: 900
      JWT_REFRESH_TOKEN_TTL: 7d
      JWT_REFRESH_TOKEN_TTL_DAYS: 7
      JWT_ISSUER: color-trading-api
      JWT_AUDIENCE: color-trading-client
      GAME_ENGINE_ENABLED: true
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: color-trading-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: color-trading-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: color_trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d color_trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: color-trading-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
