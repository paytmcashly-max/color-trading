services:
  - type: web
    name: color-trading-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: color-trading-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: ROUND_SEED_ENCRYPTION_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SOCKET_ALLOWED_ORIGINS
        sync: false
      - key: API_PREFIX
        value: /api/v1
      - key: JWT_ACCESS_TOKEN_TTL
        value: 15m
      - key: JWT_ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: JWT_REFRESH_TOKEN_TTL
        value: 7d
      - key: JWT_REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: JWT_ISSUER
        value: color-trading-api
      - key: JWT_AUDIENCE
        value: color-trading-client
      - key: GAME_ENGINE_ENABLED
        value: "true"
      - key: PAYMENT_SERVICE_ENABLED
        value: "false"
      - key: REAL_MONEY_ENABLED
        value: "false"
      - key: COMPLIANCE_APPROVED
        value: "false"
      - key: PAYMENT_PROVIDER_APPROVED
        value: "false"
      - key: KYC_ENABLED
        value: "false"
      - key: AML_CHECKS_ENABLED
        value: "false"
      - key: RESPONSIBLE_GAMING_ENABLED
        value: "false"
      - key: GAME_ROUND_DURATION_SECONDS
        value: "60"
      - key: GAME_BETTING_DURATION_SECONDS
        value: "45"
      - key: GAME_SCHEDULER_TICK_MS
        value: "1000"
      - key: GAME_ROUND_LOCK_TTL_MS
        value: "5000"
      - key: GAME_MAX_BET_PER_USER_PER_ROUND
        value: "1000"
      - key: GAME_MAX_EXPOSURE_PER_COLOR
        value: "100000"
      - key: PAYMENT_APP_URL
        sync: false
      - key: PAYMENT_INTENT_SIGNING_SECRET
        sync: false
      - key: PAYMENT_SERVICE_SECRET
        sync: false

  - type: web
    name: color-trading-payment
    runtime: docker
    plan: free
    dockerfilePath: ./apps/payment/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENT_SERVICE_ENABLED
        value: "false"
      - key: PAYMENT_DATABASE_URL
        fromDatabase:
          name: color-trading-payment-postgres
          property: connectionString
      - key: MAIN_API_URL
        sync: false
      - key: MAIN_CLIENT_URL
        sync: false
      - key: PAYMENT_INTENT_SIGNING_SECRET
        sync: false
      - key: PAYMENT_SERVICE_SECRET
        sync: false
      - key: CASHFREE_CLIENT_ID
        sync: false
      - key: CASHFREE_CLIENT_SECRET
        sync: false
      - key: CASHFREE_API_VERSION
        value: 2025-01-01
      - key: CASHFREE_BASE_URL
        value: https://sandbox.cashfree.com/pg
      - key: CASHFREE_RETURN_URL
        sync: false
      - key: CASHFREE_WEBHOOK_URL
        sync: false

databases:
  - name: color-trading-postgres
    databaseName: color_trading
    user: color_trading
    plan: free
  - name: color-trading-payment-postgres
    databaseName: color_trading_payments
    user: color_trading_payment
    plan: free
