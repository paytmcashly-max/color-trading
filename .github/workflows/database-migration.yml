name: Production database migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing DATABASE_URL
        required: true
        type: choice
        options:
          - staging
          - production
      target:
        description: Database to migrate
        required: true
        type: choice
        options:
          - main
          - payment

permissions:
  contents: read

concurrency:
  group: database-migration-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PAYMENT_DATABASE_URL: ${{ secrets.PAYMENT_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Verify database secret
        run: |
          if [ "${{ inputs.target }}" = "main" ]; then test -n "$DATABASE_URL"; fi
          if [ "${{ inputs.target }}" = "payment" ]; then test -n "$PAYMENT_DATABASE_URL"; fi

      - name: Apply main database migrations
        if: inputs.target == 'main'
        run: npm run db:migrate:deploy

      - name: Apply payment database migrations
        if: inputs.target == 'payment'
        run: npm run db:migrate:deploy -w @color-trading/payment
