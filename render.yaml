services:
  - type: web
    name: color-trading-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    preDeployCommand: node apps/server/scripts/apply-schema.mjs
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: color-trading-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SOCKET_CORS_ORIGIN
        sync: false
      - key: SOCKET_ALLOWED_ORIGINS
        sync: false
      - key: JWT_ACCESS_TOKEN_TTL
        value: 15m
      - key: JWT_ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: JWT_REFRESH_TOKEN_TTL
        value: 7d
      - key: JWT_REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: JWT_ISSUER
        value: color-trading-api
      - key: JWT_AUDIENCE
        value: color-trading-client
      - key: GAME_ENGINE_ENABLED
        value: "true"

databases:
  - name: color-trading-postgres
    databaseName: color_trading
    user: color_trading
    plan: free
