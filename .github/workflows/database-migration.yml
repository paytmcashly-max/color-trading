name: Production database migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing DATABASE_URL
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: database-migration-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Verify database secret
        run: test -n "$DATABASE_URL"

      - name: Apply database migrations
        run: npm run db:migrate:deploy
